<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Avyo - Gọi Xe Tinh Gọn 0Đ</title>

  <link rel="icon" type="image/png" sizes="192x192" href="index.png">
  <link rel="apple-touch-icon" sizes="180x180" href="index.png">
  <link rel="manifest" href="index-manifest.json">
  <meta name="theme-color" content="#00b14f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Thư viện Leaflet & Supabase -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/gh/ewoken/Leaflet.MovingMarker@master/MovingMarker.js"></script>

  <link rel="stylesheet" href="index.css?v=57">
</head>
<body class="selecting-pickup">

  <!-- BẢN ĐỒ CỐ ĐỊNH NỀN -->
  <div id="map"></div>

  <!-- GHIM CỐ ĐỊNH CHÍNH GIỮA TẠI MỐC 1/3 PHÍA TRÊN MÀN HÌNH -->
  <div id="fixedCenterPin" class="fixed-center-pin">
    <svg width="42" height="42" viewBox="0 0 24 24" fill="#dc2626" stroke="#ffffff" stroke-width="1.5" class="pin-svg">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
    </svg>
    <div class="pin-shadow"></div>
  </div>

  <!-- NÚT NỔI ĐỊNH VỊ GPS LỒNG BÊN TRONG BẢN ĐỒ -->
  <button id="gpsFloatBtn" class="btn-gps-float" onclick="useCurrentLocationAsPickup()" title="Vị trí hiện tại">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
    </svg>
  </button>

  <!-- NÚT NỔI CHỌN XE -->
  <button id="vehicleFloatBtn" class="btn-vehicle-float" onclick="toggleVehicleMenu()" title="Chọn loại xe">
    <span id="activeVehicleLabel">🛵 Xe máy (6.000đ/km)</span> ▾
  </button>

  <!-- MENU CHỌN LOẠI XE POPUP -->
  <div id="vehicleMenu" class="vehicle-menu-popover">
    <div class="vehicle-option active" onclick="selectFilter('bike', this)">🛵 Xe máy (6.000đ/km)</div>
    <div class="vehicle-option" onclick="selectFilter('car', this)">🚕 Ô tô (11.000đ/km)</div>
    <div class="vehicle-option" onclick="selectFilter('driver', this)">👤 Lái xe hộ (11.000đ/km)</div>
    <div class="vehicle-option" onclick="selectFilter('truck', this)">🚚 Chở hàng (Thỏa thuận)</div>
  </div>

  <!-- CỤM ĐẦU MÀN HÌNH -->
  <div class="top-section">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
      <span style="font-size: 13px; font-weight: 800; color: #00b14f; letter-spacing: 0.5px;">AVYO</span>
      <div style="display: flex; align-items: center; gap: 6px;">
        <!-- NÚT RESET DẠNG ICON NHỎ GỌN -->
        <button id="resetBtn" class="btn-reset-icon" onclick="resetRoute()" title="Đặt lại điểm đón/đến">🔄</button>
        <button id="themeToggle" class="btn-theme-toggle" onclick="toggleDarkMode()" title="Giao diện Tối/Sáng">🌙</button>
      </div>
    </div>

    <!-- Ô NHẬP ĐIỂM ĐÓN + NÚT GHIM PIN -->
    <div class="search-input-group pickup-group">
      <input type="text" id="pickupInput" placeholder="📍 Tìm điểm đón (VD: Sân bay Vinh)..." autocomplete="off" oninput="onSearchInput('pickup')" onfocus="showRecentPickups()">
      <button type="button" class="btn-pin-select" onclick="triggerPinSelection('pickup')" title="Chọn điểm đón bằng ghim pin trên bản đồ">📍</button>
      <div id="pickupSuggestions" class="suggestions-list"></div>
    </div>

    <!-- Ô NHẬP ĐIỂM ĐẾN + NÚT GHIM PIN -->
    <div class="search-input-group dest-group" style="margin-bottom: 0px;">
      <input type="text" id="destInput" placeholder="🚩 Tìm điểm đến (VD: Bến xe Vinh)..." autocomplete="off" oninput="onSearchInput('dest')" onfocus="showRecentDests()">
      <button type="button" class="btn-pin-select" onclick="triggerPinSelection('dest')" title="Chọn điểm đến bằng ghim pin trên bản đồ">🚩</button>
      <div id="destSuggestions" class="suggestions-list"></div>
    </div>

    <!-- NÚT XÁC NHẬN VỊ TRÍ CHÍNH GIỮA BẢN ĐỒ -->
    <button id="confirmSelectBtn" class="btn-confirm-select" onclick="confirmAndExitSelection()">
      📍 CHỌN ĐIỂM ĐÓN NÀY
    </button>
  </div>

  <!-- CỤM ĐÁY MÀN HÌNH -->
  <div class="bottom-section">
    <!-- Khối 1: Cước phí & Số Km tinh gọn -->
    <div class="section-block">
      <div class="price-container">
        <div id="price" class="price">0đ</div>
        <small id="rate-label" style="font-size: 13px; color: #15803d; font-weight: 600; line-height: 1.3;"></small>
      </div>
    </div>

    <!-- Khối 2: 3 Tài xế gần điểm đón nhất -->
    <div id="top3Card" class="section-block divider-top" style="display: none;">
      <h4 style="margin: 0 0 8px 0; color: #334155; font-size: 13px; display: flex; align-items: center; justify-content: space-between;">
        <span>⚡ 3 Tài Xế Gần điểm đón nhất</span>
        <span id="radiusBadge" style="font-size: 11px; color: #64748b; font-weight: normal;">Bán kính 5km</span>
      </h4>
      <div id="top3List"></div>
    </div>
  </div>

  <!-- POPUP ĐÁNH GIÁ TÀI XẾ (KÍCH HOẠT SAU KHI BẤM GỌI/ZALO) -->
  <div id="ratingModalOverlay" class="custom-alert-overlay">
    <div class="custom-alert-box">
      <div class="custom-alert-icon">🌟</div>
      <div id="ratingModalTitle" class="custom-alert-title">Đánh Giá Chuyến Đi</div>
      <div class="custom-alert-msg" style="margin-bottom: 12px;">Vui lòng chọn số sao trải nghiệm dịch vụ:</div>
      
      <div id="modalStarBox" class="star-box" style="margin-bottom: 18px;">
        <span class="star-btn" data-star="1" onclick="submitModalRating(1)" onmouseenter="highlightModalStars(1)">⭐</span>
        <span class="star-btn" data-star="2" onclick="submitModalRating(2)" onmouseenter="highlightModalStars(2)">⭐</span>
        <span class="star-btn" data-star="3" onclick="submitModalRating(3)" onmouseenter="highlightModalStars(3)">⭐</span>
        <span class="star-btn" data-star="4" onclick="submitModalRating(4)" onmouseenter="highlightModalStars(4)">⭐</span>
        <span class="star-btn" data-star="5" onclick="submitModalRating(5)" onmouseenter="highlightModalStars(5)">⭐</span>
      </div>

      <button class="custom-alert-btn" style="background: #94a3b8; box-shadow: none;" onclick="closeRatingModal()">ĐỂ SAU</button>
    </div>
  </div>

  <script src="utils.js?v=57"></script>
  <script src="index.js?v=57"></script>
</body>
</html>
