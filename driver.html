<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Avyo - App Tài Xế</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00B14F">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --grab-green: #00B14F;
      --grab-dark: #008E3F;
      --grab-light: #E6F7ED;
      --grab-red: #EF4444;
      --bg-slate: #F4F6F8;
      --text-main: #1C1C1E;
      --text-sub: #7C7C80;
    }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      padding: 16px; 
      max-width: 420px; 
      margin: auto; 
      background: var(--bg-slate); 
      color: var(--text-main);
      -webkit-tap-highlight-color: transparent;
    }
    .card { 
      background: white; 
      padding: 24px; 
      border-radius: 20px; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.06); 
      text-align: center; 
    }
    input, button { 
      width: 100%; 
      padding: 14px; 
      margin-top: 12px; 
      border-radius: 12px; 
      border: 1.5px solid #E2E8F0; 
      font-size: 15px; 
      box-sizing: border-box; 
      outline: none;
      transition: all 0.2s ease;
    }
    input:focus {
      border-color: var(--grab-green);
    }
    button { 
      background: var(--grab-green); 
      color: white; 
      font-weight: 700; 
      border: none; 
      cursor: pointer; 
      box-shadow: 0 4px 14px rgba(0,177,79,0.3);
      transition: all 0.2s ease;
    }
    button:active {
      transform: scale(0.98);
    }
    .status-badge { 
      font-weight: 700; 
      margin: 18px 0; 
      font-size: 15px; 
      padding: 12px;
      border-radius: 14px;
    }
    .status-online {
      background: var(--grab-light);
      color: var(--grab-dark);
    }
    .status-offline {
      background: #FEF2F2;
      color: var(--grab-red);
    }
    .logout-text { 
      color: var(--text-sub); 
      font-size: 13px; 
      text-decoration: underline; 
      margin-top: 20px; 
      display: block; 
      cursor: pointer; 
    }
  </style>
</head>
<body>

  <!-- MÀN HÌNH ĐĂNG NHẬP -->
  <div id="loginScreen" class="card" style="display: none;">
    <h2 style="margin-top: 0; color: var(--grab-green);">🟢 Avyo Tài Xế</h2>
    <p style="color: var(--text-sub); font-size: 14px; margin-bottom: 20px;">Đăng nhập để nhận cuốc xe</p>
    
    <input type="tel" id="phoneInput" placeholder="Số điện thoại của bạn" autocomplete="off">
    <input type="password" id="pinInput" placeholder="Mã PIN (Mật khẩu)" autocomplete="off">
    
    <button onclick="login()" style="margin-top: 20px;">ĐĂNG NHẬP HỆ THỐNG</button>
  </div>

  <!-- MÀN HÌNH ĐIỀU KHIỂN GPS CỦA TÀI XẾ -->
  <div id="appScreen" class="card" style="display: none;">
    
    <!-- Khung thông tin tài xế -->
    <div style="background: var(--grab-light); padding: 14px; border-radius: 14px; margin-bottom: 15px;">
      <h3 id="driverNameLabel" style="margin: 0; color: var(--grab-dark);">--</h3>
      <p id="vehicleLabel" style="margin: 5px 0 0 0; font-size: 13px; color: #166534;">--</p>
    </div>

    <!-- Trạng thái GPS -->
    <div id="status" class="status-badge status-offline">🔴 ĐÃ TẮT ĐỊNH VỊ (Nghỉ ngơi)</div>
    <p style="font-size: 12px; color: var(--text-sub);">Tọa độ GPS: <span id="coords">--</span></p>

    <!-- Nút Bật/Tắt -->
    <button id="toggleBtn" onclick="toggleOnline()">BẮT ĐẦU NHẬN KHÁCH (BẬT GPS)</button>

    <!-- Nút Đăng xuất -->
    <a class="logout-text" onclick="logout()">Đăng xuất tài khoản</a>
  </div>

  <script>
    // --- 1. KẾT NỐI SUPABASE ---
    const SUPABASE_URL = 'https://yvucyqkglbgxvozrznir.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl2dWN5cWtnbGJneHZvenJ6bmlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMzA3ODAsImV4cCI6MjEwNDcwNjc4MH0.Zagl4i2LPmxW3w9ih0h4LRsrm-OOGtPcWgvEs2vHBqo';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let isOnline = false;
    let watchId = null;
    
    // Lấy ID tài khoản đã lưu trong điện thoại
    let currentDriverId = localStorage.getItem('avyo_driver_id');

    // --- 2. KIỂM TRA ĐĂNG NHẬP KHI MỞ APP ---
    if (currentDriverId) {
      // Đã đăng nhập -> Hiện màn hình điều khiển
      document.getElementById('appScreen').style.display = 'block';
      document.getElementById('driverNameLabel').innerText = "Tài xế: " + localStorage.getItem('avyo_driver_name');
      document.getElementById('vehicleLabel').innerText = localStorage.getItem('avyo_vehicle');
    } else {
      // Chưa đăng nhập -> Hiện màn hình Login
      document.getElementById('loginScreen').style.display = 'block';
    }

    // --- 3. HÀM XỬ LÝ ĐĂNG NHẬP ---
    async function login() {
      const phone = document.getElementById('phoneInput').value.trim();
      const pin = document.getElementById('pinInput').value.trim();
      
      if (!phone || !pin) {
        return alert("Vui lòng nhập đủ SĐT và Mã PIN!");
      }

      const btn = document.querySelector('#loginScreen button');
      btn.innerText = "Đang kiểm tra...";

      // Truy vấn Database để kiểm tra
      const { data, error } = await supabaseClient
        .from('drivers')
        .select('*')
        .eq('phone', phone)
        .eq('pin', pin)
        .single();

      if (error || !data) {
        alert("❌ Sai Số điện thoại hoặc Mã PIN!");
        btn.innerText = "ĐĂNG NHẬP HỆ THỐNG";
      } else {
        // Lưu thông tin vào bộ nhớ điện thoại
        localStorage.setItem('avyo_driver_id', data.id);
        localStorage.setItem('avyo_driver_name', data.name);
        localStorage.setItem('avyo_vehicle', data.vehicle || 'Chưa cập nhật xe');
        
        alert("✅ Đăng nhập thành công!");
        window.location.reload(); // Tải lại trang để tự động chuyển vào App
      }
    }

    // --- 4. HÀM ĐĂNG XUẤT ---
    function logout() {
      if (confirm("Bạn có chắc chắn muốn đăng xuất không?")) {
        // Nếu đang bật GPS thì tắt đi
        if (isOnline) {
          toggleOnline(); 
        }
        
        // Xóa sạch bộ nhớ
        localStorage.removeItem('avyo_driver_id');
        localStorage.removeItem('avyo_driver_name');
        localStorage.removeItem('avyo_vehicle');
        
        window.location.reload();
      }
    }

    // --- 5. HÀM XỬ LÝ GPS (BẬT / TẮT) ---
    async function updateLocation(lat, lng) {
      if (!currentDriverId || !isOnline) return;
      
      await supabaseClient.from('drivers').update({ 
        lat: lat, 
        lng: lng, 
        is_online: true, 
        updated_at: new Date().toISOString() 
      }).eq('id', currentDriverId);
    }

    async function toggleOnline() {
      if (!currentDriverId) {
        return alert('Lỗi tài khoản, vui lòng đăng xuất và đăng nhập lại!');
      }

      const btn = document.getElementById('toggleBtn');
      const status = document.getElementById('status');

      if (!isOnline) {
        // BẬT GPS
        if (!navigator.geolocation) return alert('Thiết bị không hỗ trợ GPS');
        
        isOnline = true;
        btn.innerText = 'TẮT NHẬN KHÁCH (NGHỈ NGƠI)'; 
        btn.style.background = '#EF4444';
        status.className = 'status-badge status-online';
        status.innerHTML = '🟢 ĐANG PHÁT GPS ĐỂ ĐÓN KHÁCH'; 

        let lastUpdateTime = 0; 
        
        watchId = navigator.geolocation.watchPosition(async (pos) => {
          if (!isOnline) return;
          
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          document.getElementById('coords').innerText = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
          
          const now = Date.now();
          if (now - lastUpdateTime >= 3000) { 
            await updateLocation(lat, lng); 
            lastUpdateTime = now; 
          }
        }, (err) => {
          alert('Lỗi GPS: ' + err.message);
        }, { 
          enableHighAccuracy: true 
        });

      } else {
        // TẮT GPS
        isOnline = false;
        
        if (watchId) { 
          navigator.geolocation.clearWatch(watchId); 
          watchId = null; 
        }
        
        await supabaseClient.from('drivers').update({ 
          is_online: false, 
          updated_at: new Date().toISOString() 
        }).eq('id', currentDriverId);
        
        status.className = 'status-badge status-offline';
        status.innerHTML = '🔴 ĐÃ TẮT ĐỊNH VỊ (Nghỉ ngơi)'; 
        
        btn.innerText = 'BẮT ĐẦU NHẬN KHÁCH (BẬT GPS)'; 
        btn.style.background = '#00B14F';
      }
    }
  </script>
  
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
